services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16-bookworm
    container_name: lenny-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lenny_growth
      POSTGRES_USER: lenny_user
      POSTGRES_PASSWORD: lenny_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: